name: eyesight_ai
description: >-
  EyeSight AI: herramienta de apoyo a la movilidad autónoma de personas con
  discapacidad visual en Pasto, Nariño. Detección de obstáculos con YOLOv8n
  en el teléfono, funcionamiento sin conectividad y memoria georreferenciada
  de zonas de riesgo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado, inyección de dependencias y rutas (numeral 3.12.4)
  get: ^4.6.6

  # Persistencia local cifrada (numerales 2.2.3 y 4.3.7)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Inteligencia artificial y video (numeral 3.12.5)
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1

  # Servicios del dispositivo (numeral 4.3.4)
  geolocator: ^13.0.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  vibration: ^3.2.1
  permission_handler: ^11.3.0
  wakelock_plus: ^1.2.8

  # Mapa del acompañante (HU10)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Archivos y exportación CSV (HU15)
  path_provider: ^2.1.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/

  # Tipografías de la marca, incluidas en la app para funcionar sin internet
  # (licencia SIL Open Font License, ver assets/fonts/OFL-*.txt).
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
